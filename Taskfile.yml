version: '3'

tasks:
  claude:
    desc: Copy Claude Code CLAUDE.md and settings.json to ~/.claude
    cmds:
      - mkdir -p "$HOME/.claude"
      - cp claude/CLAUDE.md claude/settings.json "$HOME/.claude/"
